# Dataset Schema Definition
columns:
  page_id:
    type: int
    required: false
  text:
    type: string
    required: true
  label:
    type: int
    required: true
    allowed_values: [0, 1]
  Pattern Category:
    type: string
    required: false

target_column: "label"

classes:
  0: "Not Dark Pattern"
  1: "Dark Pattern"

categories:
  - "Urgency"
  - "Scarcity"
  - "Misdirection"
  - "Social Proof"
  - "Obstruction"
  - "Sneaking"
  - "Forced Action"
  - "Not Dark Pattern"
