<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background rounded gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>

    <!-- Shield Primary Amber Gradient -->
    <linearGradient id="amberShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#171412" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#44403c" stroke-width="1.5" />

  <!-- Subtle Shield Backing Glow -->
  <path d="M32 9 L14 17 C14 31 22 47 32 55 C42 47 50 31 50 17 Z" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="3" 
        opacity="0.25" 
        filter="url(#amberGlow)" />

  <!-- Outer Shield Shell -->
  <path d="M32 10 L15 18 C15 31 22.5 46 32 54 C41.5 46 49 31 49 18 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#amberShield)" 
        stroke-width="2.2" 
        stroke-linejoin="round" />

  <!-- Inner Sentinel Core Geometry (Radar / Crosshair / Pattern Breaker) -->
  <g transform="translate(0, 1)">
    <!-- Radar Arc 1 -->
    <circle cx="32" cy="30" r="11" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.4" stroke-dasharray="2 3" />
    
    <!-- Radar Arc 2 -->
    <circle cx="32" cy="30" r="6" fill="none" stroke="#fbbf24" stroke-width="1.4" opacity="0.7" />

    <!-- Center Pulse Core -->
    <circle cx="32" cy="30" r="2.8" fill="#fbbf24" filter="url(#amberGlow)" />

    <!-- Analytical Crosshair Marks -->
    <line x1="32" y1="17" x2="32" y2="21" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="32" y1="39" x2="32" y2="43" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="19" y1="30" x2="23" y2="30" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
    <line x1="41" y1="30" x2="45" y2="30" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>